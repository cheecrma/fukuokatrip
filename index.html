<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>후쿠오카 3박 4일</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#007F00">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="후쿠오카">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Gothic+A1:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFBEC; --card:#FFFFFF; --ink:#1C281D; --ink2:#5D6A5B; --line:#EDE4C6;
  --coral:#007F00; --coral-d:#005E10; --coral-l:#FFF1B8; --sea:#FFF5CF; --label:#FFFFFF;
  --ok:#4E8C6A;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1A12; --card:#16241A; --ink:#F5F1DC; --ink2:#B4BCA6; --line:#283A2C;
    --coral:#1C6E2A; --coral-d:#8ED394; --coral-l:#2C2912; --sea:#2A2715; --label:#FFF5CF;
    --ok:#7FC39C; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1A12; --card:#16241A; --ink:#F5F1DC; --ink2:#B4BCA6; --line:#283A2C;
  --coral:#1C6E2A; --coral-d:#8ED394; --coral-l:#2C2912; --sea:#2A2715; --label:#FFF5CF;
  --ok:#7FC39C; color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.num{font-family:"Bricolage Grotesque","Gothic A1",system-ui,sans-serif;font-variant-numeric:tabular-nums}
a{color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}

/* hero */
.hero{padding-top:28px;padding-bottom:8px}
.hero h1{font-size:clamp(52px,16vw,76px);line-height:.95;font-weight:900;letter-spacing:-.045em;margin:0}
.hero .who{margin:12px 0 0;color:var(--ink2);font-size:16px}
.count{display:inline-flex;align-items:baseline;gap:8px;margin-top:18px;padding:8px 14px 8px 12px;border-radius:999px;background:var(--coral-l);color:var(--coral-d);font-weight:700}
.count b{font-size:22px}
.route{margin:22px 0 6px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.route .code{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.route small{display:block;font-family:"Gothic A1",sans-serif;font-size:12px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:4px}
.route svg{width:100%;height:46px;overflow:visible}

/* day tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0;margin-top:14px;border-bottom:1px solid var(--line)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{appearance:none;border:0;background:transparent;color:var(--ink2);padding:6px 2px;border-radius:14px;cursor:pointer;font:inherit;text-align:center;line-height:1.15}
.tab .d{display:block;font-size:22px;font-weight:800}
.tab .w{display:block;font-size:12px;font-weight:500}
.tab[aria-selected="true"]{background:var(--coral);color:#fff}
.tab:focus-visible{outline:3px solid var(--coral-d);outline-offset:2px}

/* day head */
.dayhead{padding:24px 0 10px}
.dayhead h2{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.03em;font-weight:900}
.dayhead p{margin:6px 0 0;color:var(--ink2)}

/* map */
.map{position:relative;margin:14px 0 4px;border-radius:26px;overflow:hidden;background:var(--sea);box-shadow:0 0 0 1px var(--line)}
.map svg{display:block;width:100%;height:auto}
.map .pin .lbl,.map .lbl{font:800 12.5px "Gothic A1",sans-serif;fill:#FFF1B8;paint-order:stroke;stroke:#00450A;stroke-width:3.5px;stroke-linejoin:round}
.map .water-lbl{font:500 11px "Gothic A1",sans-serif;fill:var(--ink2);opacity:.7}
.map .pin{cursor:pointer}
.map .pin circle{fill:var(--label)}
.map .pin text{font:800 11px "Bricolage Grotesque",sans-serif;fill:var(--coral-d);text-anchor:middle;dominant-baseline:central}
.map .pin:focus-visible circle{stroke:var(--ink);stroke-width:2}
.map-note{font-size:12px;color:var(--ink2);margin:6px 4px 0}

/* timeline */
.tl{list-style:none;margin:18px 0 0;padding:0}
.item{display:grid;grid-template-columns:76px 1fr;gap:0 14px;position:relative;padding-bottom:22px}
.item::before{content:"";position:absolute;left:87px;top:14px;bottom:-4px;border-left:2px dashed var(--line)}
.item:last-child::before{display:none}
.t{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;text-align:right;padding-top:2px}
.t .est{display:block;font-family:"Gothic A1",sans-serif;font-size:11px;font-weight:500;color:var(--ink2);letter-spacing:0;margin-top:3px}
.body{position:relative;padding-left:16px}
.body::before{content:"";position:absolute;left:-9px;top:9px;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--coral)}
.item.kind-flight .body::before{background:var(--coral)}
.item.now .body::before{background:var(--coral-d);border-color:var(--coral-d);box-shadow:0 0 0 6px var(--coral-l)}
.now-tag{display:inline-block;font-size:11px;font-weight:700;color:#fff;background:var(--coral-d);border-radius:6px;padding:1px 7px;margin-bottom:4px}
.body h3{margin:0;font-size:17.5px;line-height:1.35;letter-spacing:-.02em;display:flex;gap:8px;align-items:flex-start}
.badge{flex:none;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font:800 12px "Bricolage Grotesque",sans-serif;margin-top:1px}
.sub{margin:2px 0 0;color:var(--ink2);font-size:14px}
.body ul{margin:8px 0 0;padding-left:18px}
.body li{margin:2px 0}
.body li::marker{color:var(--coral)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;text-decoration:none;padding:7px 12px;border-radius:999px;border:1.5px solid var(--coral);color:var(--coral-d);background:transparent}
.btn svg{width:14px;height:14px}
.btn:focus-visible{outline:3px solid var(--coral-d);outline-offset:2px}

.flight{margin-top:10px;border-radius:18px;background:var(--coral);color:#fff;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px}
.flight .c{font-size:24px;font-weight:800;line-height:1}
.flight .c small{display:block;font:500 11px "Gothic A1",sans-serif;opacity:.9;margin-top:4px}
.flight .mid{text-align:center;font-size:12px;opacity:.95}
.flight .mid hr{border:0;border-top:2px dashed rgba(255,255,255,.7);margin:6px 0}

.tl .guide{margin-left:-106px;width:calc(100% + 106px)}
.apps h3{font-size:13px;color:var(--coral-d);margin:18px 2px 8px;letter-spacing:.02em}
.app{border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:12px 14px;margin-bottom:8px}
.app .an{font-weight:800;font-size:15.5px}
.app .an small{font-weight:500;color:var(--ink2);font-size:12.5px;margin-left:6px}
.app p{margin:4px 0 0;font-size:14px}
.app .when{display:inline-block;margin-top:6px;font-size:12px;font-weight:700;color:var(--coral-d);background:var(--coral-l);border-radius:6px;padding:1px 8px}
.more{margin-top:8px;border-radius:16px;background:transparent;box-shadow:0 0 0 1.5px var(--coral) inset;margin-bottom:0}
.more summary{padding:10px 14px;font-size:14px;color:var(--coral-d)}
.more .in{padding:0 10px 10px}
.more .food{margin-top:8px}
.wx{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:4px 14px;margin:8px 0 2px;padding:14px 16px;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line);min-height:76px}
.wx-ic{width:44px;height:44px;border-radius:14px;background:var(--coral-l);color:var(--coral-d);display:grid;place-items:center}
.wx-ic svg{width:28px;height:28px}
.wx-b{display:flex;flex-direction:column;line-height:1.35;min-width:0}
.wx-b .loc{font-size:12.5px;font-weight:700;color:var(--ink2)}
.wx-b b{font-size:16.5px;letter-spacing:-.02em}
.wx-t{text-align:right;line-height:1.05}
.wx-t .hi{font-size:28px;font-weight:800;letter-spacing:-.03em;color:var(--coral-d)}
.wx-t .lo{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-top:3px}
.wx-foot{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.wx-foot span{font-size:12px;font-weight:700;color:var(--coral-d);background:var(--coral-l);border-radius:6px;padding:1px 8px}
.wx-note{font-size:13px;color:var(--ink2)}
.peek iframe{display:block;width:100%;height:260px;border:0;border-radius:14px;margin-top:10px;background:var(--coral-l)}
.lockbox{border-radius:20px;background:var(--card);box-shadow:0 0 0 1.5px var(--coral) inset;padding:16px 18px;margin-bottom:12px}
.lk-t{display:flex;align-items:center;gap:8px;font-weight:900;font-size:17px;letter-spacing:-.02em}
.lk-t svg{width:18px;height:18px;color:var(--coral-d)}
.lk-row{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
.lk-row input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);min-width:0}
.lk-row input:focus{outline:none;border-color:var(--coral)}
.addbtn{font:inherit;font-weight:800;font-size:16px;border:0;border-radius:12px;background:var(--coral);color:#fff;cursor:pointer;padding:0 18px}
.addbtn:focus-visible{outline:3px solid var(--coral-d);outline-offset:2px}
.taxi{margin-top:10px;border-radius:16px;background:var(--coral);color:#fff;padding:14px 16px}
.taxi small{display:block;font-size:12px;opacity:.9}
.taxi b{display:block;font-size:20px;line-height:1.35;margin:4px 0}
.taxi span{font-size:14px}
.jp-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:6px;font:inherit;font-weight:800;font-size:14px;color:#fff;background:var(--coral);border:0;border-radius:999px;padding:10px 16px 10px 12px;box-shadow:0 6px 18px rgba(0,60,0,.28);cursor:pointer}
.jp-fab span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:#FFF1B8;color:#005E10;font-size:15px}
.jp-fab:focus-visible{outline:3px solid var(--coral-d);outline-offset:3px}
.jp-dlg{width:min(560px,100vw);max-width:100vw;height:88vh;max-height:88vh;margin:auto auto 0;border:0;border-radius:24px 24px 0 0;padding:0 16px calc(20px + env(safe-area-inset-bottom,0px));background:var(--paper);color:var(--ink);overflow:auto;overscroll-behavior:contain}
.jp-top{position:sticky;top:0;z-index:1;background:var(--paper);padding-top:16px;margin:0 -16px;padding-left:16px;padding-right:16px;border-bottom:1px solid var(--line)}
.jp-chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none;overscroll-behavior:contain}
.jp-chips::-webkit-scrollbar{display:none}
.jp-chip{flex:none;font:inherit;font-size:13.5px;font-weight:700;padding:7px 13px;border-radius:999px;border:1.5px solid var(--coral);background:transparent;color:var(--coral-d);cursor:pointer}
.jp-chip[aria-selected="true"]{background:var(--coral);color:#fff}
.jp-tip{font-size:13px;color:var(--coral-d);background:var(--coral-l);border-radius:8px;padding:2px 10px;margin:-6px 0 12px}
.jp-dlg::backdrop{background:rgba(10,30,12,.45)}
.jp-head{display:flex;justify-content:space-between;align-items:center;margin:0 2px 4px}
.jp-head b{font-size:20px;letter-spacing:-.02em}
.jp-x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:22px;line-height:1;cursor:pointer}
.jp-dlg h3{font-size:13px;color:var(--coral-d);margin:14px 2px 6px}
.jp-list{display:grid;gap:6px}
.jp-item{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:2px;font:inherit;padding:10px 14px;border-radius:14px;border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);color:var(--ink);cursor:pointer}
.jp-item span{font-weight:700;font-size:15px}
.jp-item small{font-size:13px;color:var(--ink2)}
.jp-item:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.jp-big{min-height:80vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;position:relative;padding-top:40px}
.jp-big .jp-x{position:absolute;left:0;top:16px}
.jp-ja{font-size:clamp(30px,9vw,46px);font-weight:900;line-height:1.35;margin:0;color:var(--coral-d);word-break:normal;overflow-wrap:anywhere;max-width:100%}
.jp-read{font-size:16px;color:var(--ink2);margin:0}
.jp-ko{font-size:18px;font-weight:700;margin:6px 0 14px}
footer{padding-bottom:90px}
.guide{margin-top:10px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:0}
.guide summary{padding:11px 14px;font-size:14px;color:var(--coral-d)}
.guide .in{padding:0 12px 14px}
.guide svg{display:block;width:100%;height:auto;margin:2px 0 8px}
.guide svg text{font-family:"Gothic A1",sans-serif}
.flow{list-style:none;margin:6px 0 0;padding:0;counter-reset:f}
.flow li{position:relative;padding:0 0 12px 34px;font-size:14px;counter-increment:f}
.flow li::before{content:counter(f);position:absolute;left:0;top:0;width:22px;height:22px;border-radius:50%;background:var(--coral);color:#fff;font:800 12px "Bricolage Grotesque",sans-serif;display:grid;place-items:center}
.flow li::after{content:"";position:absolute;left:10px;top:24px;bottom:2px;border-left:2px dashed var(--line)}
.flow li:last-child::after{display:none}
.flow li b{display:block;font-size:14.5px}
.flow li.key::before{background:#E0B000;color:#1C281D}
.gnote{font-size:12.5px;color:var(--ink2);margin:4px 2px 0}
.food{margin-top:10px;border-radius:16px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:12px 14px}
.food + .food{margin-top:8px}
.food .fn{font-weight:700;font-size:15.5px}
.food .jp{color:var(--ink2);font-size:12.5px}
.food .m{margin:4px 0 0;font-size:14px}
.food .m b{color:var(--coral-d);font-weight:700}
.food .nt{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}
.food .btns{margin-top:8px}
.food.alt{background:transparent;box-shadow:0 0 0 1px var(--line) inset}
.alt-tag{font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-left:6px;vertical-align:2px}

/* sections */
section.block{padding:34px 0 6px}
section.block > h2{font-size:24px;letter-spacing:-.03em;margin:0 0 12px;font-weight:900}
.ticket{position:relative;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line);padding:16px 18px;margin-bottom:12px}
.ticket{border-left:5px solid var(--coral)}
.ticket .k{font-size:12.5px;color:var(--ink2);font-weight:700}
.ticket .v{font-size:17px;font-weight:700;margin-top:2px}
.ticket .d{font-size:13.5px;color:var(--ink2);margin-top:4px}
.ticket .p{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:66px;text-align:center;font-size:15px;font-weight:800;line-height:1.2}
.ticket .p small{display:block;font:500 11px "Gothic A1",sans-serif;color:var(--ink2)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0;font-weight:700}
.total .num{font-size:24px;font-weight:800}
.hotel{border-radius:20px;background:var(--coral-l);padding:16px 18px;margin-bottom:12px}
.hotel label{display:block;font-size:12.5px;font-weight:700;color:var(--coral-d);margin:0 0 4px}
.hotel input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1.5px solid transparent;background:var(--card);color:var(--ink)}
.hotel input:focus{outline:none;border-color:var(--coral)}
.hotel .row + .row{margin-top:10px}

.check{list-style:none;margin:0;padding:0;border-radius:20px;background:var(--card);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.check li + li{border-top:1px solid var(--line)}
.check label{display:flex;gap:12px;align-items:center;padding:13px 16px;cursor:pointer}
.check input{appearance:none;flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--coral);display:grid;place-items:center;margin:0;cursor:pointer}
.check input:checked{background:var(--coral)}
.check input:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible{outline:3px solid var(--coral-d);outline-offset:2px}
.check input:checked + span{color:var(--ink2);text-decoration:line-through}
.check .why{display:block;font-size:12.5px;color:var(--ink2);text-decoration:none}
.prog{font-size:13px;color:var(--ink2);margin:0 0 10px}

details{border-radius:18px;background:var(--card);box-shadow:0 0 0 1px var(--line);margin-bottom:10px}
summary{cursor:pointer;list-style:none;padding:14px 16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"";width:9px;height:9px;border:solid var(--coral-d);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s}
details[open] summary::after{transform:rotate(-135deg)}
details .in{padding:0 16px 14px}
details ul{margin:0;padding-left:18px}
details li{margin:3px 0}
details li::marker{color:var(--coral)}

footer{padding:30px 0 40px;color:var(--ink2);font-size:12.5px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="wrap hero">
  <h1>후쿠오카<br>3박 4일</h1>
  <p class="who">2026년 11월 11일 수요일부터 14일 토요일까지</p>
  <div class="route" aria-label="인천에서 후쿠오카, 1시간 25분">
    <div class="code num">ICN<small>17:25 출발</small></div>
    <svg viewBox="0 0 200 46" preserveAspectRatio="none" aria-hidden="true">
      <path d="M4 40 Q100 -8 196 40" fill="none" stroke="var(--coral)" stroke-width="2.5" stroke-dasharray="6 6" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="code num" style="text-align:right">FUK<small>18:50 도착</small></div>
  </div>
</header>

<nav class="tabs" aria-label="날짜 선택">
  <div class="wrap" role="tablist" id="tabs"></div>
</nav>

<main class="wrap" id="view"></main>

<footer class="wrap">
  식당 영업시간과 웨이팅은 방문 전 지도 앱에서 한 번 더 확인하세요. 투어 일정은 교통과 날씨에 따라 현장에서 바뀔 수 있습니다.
</footer>

<script>
(function(){

function seoulNow(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return {date:`${g('year')}-${g('month')}-${g('day')}`, min:(+g('hour')%24)*60 + +g('minute')};
}

function rng(seed){ return () => (seed = (seed*16807)%2147483647) / 2147483647; }
function wobble(pts, seed, amt){
  const r = rng(seed), out=[];
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[(i+1)%pts.length];
    for(let s=0;s<6;s++){ const t=s/6; out.push([a[0]+(b[0]-a[0])*t+(r()-.5)*amt, a[1]+(b[1]-a[1])*t+(r()-.5)*amt]); }
  }
  return out;
}
const smooth = pts => { // closed catmull-rom style
  let d=''; const n=pts.length;
  for(let i=0;i<n;i++){
    const p0=pts[(i-1+n)%n],p1=pts[i],p2=pts[(i+1)%n],p3=pts[(i+2)%n];
    if(i===0) d+=`M${p1[0].toFixed(1)} ${p1[1].toFixed(1)}`;
    const c1=[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6], c2=[p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6];
    d+=`C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d+'Z';
};
const line = pts => pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');

function mapNos(day){ let n=0; return day.stops.map(st=>st.ll?++n:0); }
function buildMap(day){
  const NO=mapNos(day);
  const W=360, H = day.map==='tour' ? 250 : 300, pad=34;
  const pts = day.stops.map((s,i)=>s.ll?{i, ll:s.ll, m:s.m}:null).filter(Boolean);
  // dedupe identical locations
  const uniq=[]; pts.forEach(p=>{ p.side=day.stops[p.i].side; if(!uniq.some(u=>Math.abs(u.ll[0]-p.ll[0])<1e-4&&Math.abs(u.ll[1]-p.ll[1])<1e-4)) uniq.push(p); });
  let la=uniq.map(p=>p.ll[0]), lo=uniq.map(p=>p.ll[1]);
  let minLa=Math.min(...la),maxLa=Math.max(...la),minLo=Math.min(...lo),maxLo=Math.max(...lo);
  const cos=Math.cos((minLa+maxLa)/2*Math.PI/180);
  let sx=(maxLo-minLo)*cos||0.01, sy=(maxLa-minLa)||0.01;
  const k=Math.min((W-pad*2)/sx,(H-pad*2)/sy);
  const cx=(minLo+maxLo)/2, cy=(minLa+maxLa)/2;
  const P = ll => [W/2+(ll[1]-cx)*cos*k, H/2-(ll[0]-cy)*k];
  const base=BASE[day.map], seed=day.id.charCodeAt(3)*977;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${day.title} 지도">`;
  s+=`<rect width="${W}" height="${H}" fill="var(--coral)"/>`;
  base.water.forEach((poly,j)=>{ s+=`<path d="${smooth(wobble(poly.map(P),seed+j,5))}" fill="var(--sea)"/>`; });
  base.rivers.forEach(r=>{ s+=`<path d="${line(r.map(P))}" fill="none" stroke="var(--sea)" stroke-width="${day.map==='tour'?2:4}" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`; });
  const wl=P(base.waterLabel.ll); if(wl[0]>10&&wl[0]<W-40&&wl[1]>14&&wl[1]<H-10) s+=`<text class="water-lbl" x="${wl[0]}" y="${wl[1]}">${base.waterLabel.t}</text>`;

  // route
  let seq = day.map==='tour' ? base.route.map(k=>({ll:LL[k]})) : uniq;
  for(let i=0;i<seq.length-1;i++){
    const a=P(seq[i].ll), b=P(seq[i+1].ll);
    const mx=(a[0]+b[0])/2, my=(a[1]+b[1])/2, dx=b[0]-a[0], dy=b[1]-a[1], len=Math.hypot(dx,dy);
    if(len<14) continue;
    const bend = (i%2?1:-1)*Math.min(26,len*.18);
    const qx=mx-dy/len*bend, qy=my+dx/len*bend;
    s+=`<path d="M${a[0]} ${a[1]} Q${qx} ${qy} ${b[0]} ${b[1]}" fill="none" stroke="var(--label)" stroke-width="2" stroke-dasharray="6 5" stroke-linecap="round" opacity=".95"/>`;
    // arrow at curve midpoint
    const tx=.25*a[0]+.5*qx+.25*b[0], ty=.25*a[1]+.5*qy+.25*b[1];
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI;
    s+=`<path d="M-4 -4 L2 0 L-4 4" transform="translate(${tx.toFixed(1)} ${ty.toFixed(1)}) rotate(${ang.toFixed(1)})" fill="none" stroke="var(--label)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  }
  // pins with simple collision nudge
  const placed=[];
  uniq.forEach(p=>{
    let [x,y]=P(p.ll);
    placed.forEach(q=>{ const d=Math.hypot(q[0]-x,q[1]-y); if(d<24){ y+= (y>=q[1]?1:-1)*(24-d); } });
    placed.push([x,y]);
    const right = x < W-90;
    const idxs = day.stops.map((st,i)=>st.ll&&Math.abs(st.ll[0]-p.ll[0])<1e-4&&Math.abs(st.ll[1]-p.ll[1])<1e-4?i:-1).filter(i=>i>=0);
    const txt = idxs.map(i=>NO[i]).join(',');
    const pw = txt.length>1 ? 8+txt.length*6.5 : 20;
    const off = Math.max(0,(pw-20)/2);
    s+=`<g class="pin" tabindex="0" role="button" aria-label="${p.m}, ${txt}번 일정으로 이동" data-go="${idxs[0]+1}" transform="translate(${x.toFixed(1)} ${y.toFixed(1)})">`+
       (txt.length>1?`<rect x="${-pw/2}" y="-10" width="${pw}" height="20" rx="10" style="fill:var(--label)"/>`:`<circle r="10"/>`)+`<text>${txt}</text>`+
       (p.side==='t'||p.side==='b' ? `<text class="lbl" x="0" y="${p.side==='t'?-19:21}" style="text-anchor:middle;dominant-baseline:central">${p.m}</text>` : `<text class="lbl" x="${right?15+off:-15-off}" y="1" style="text-anchor:${right?'start':'end'};dominant-baseline:central">${p.m}</text>`)+`</g>`;
  });
  s+='</svg>';
  return `<figure class="map" style="margin-left:0;margin-right:0">${s}</figure>` +
    (day.map==='tour' ? `<p class="map-note">점선은 투어버스 동선이에요. 라라포트에서 내리면 그 뒤는 직접 이동.</p>` : `<p class="map-note">번호를 누르면 해당 일정으로 이동해요.</p>`);
}

const CLOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
function foodCard(f){
  return `<div class="food${f.alt?' alt':''}"><div class="fn">${f.n}</div>`+
    (f.jp?`<div class="jp">${f.jp}</div>`:'')+
    `<p class="m">${f.m}</p>`+(f.nt?`<p class="nt">${f.nt}</p>`:'')+
    (f.q?`<div class="peek" data-q="${esc(f.q)}"></div><div class="btns"><button class="btn peek-btn" type="button" aria-expanded="false">${PIN}지도 보기</button><a class="btn" href="${gmap(f.q)}" target="_blank" rel="noopener">${CLOCK}사진, 리뷰, 영업시간</a></div>`:'')+
    `</div>`;
}
function foodsBlock(list){
  const main=list.filter(f=>!f.alt), more=list.filter(f=>f.alt);
  let h=main.map(foodCard).join('');
  if(more.length) h+=`<details class="more"><summary>다른 선택지 ${more.length}곳 더 보기</summary><div class="in">${more.map(foodCard).join('')}</div></details>`;
  return h;
}

function curIdx(day){
  if(day.id!==todayId) return -1;
  let idx=-1; day.stops.forEach((s,i)=>{ const [h,m]=s.t.split(':').map(Number); if(h*60+m<=NOW.min) idx=i; });
  return idx;
}

function renderDay(day){
  const cur=curIdx(day), NO=mapNos(day);
  let prev = null, prevName='', prevQ='';
  let h=`<div class="dayhead"><h2>${day.title}</h2><p>${day.lead}</p></div><div class="wx" id="wx" data-id="${day.id}"><span class="wx-ic">${WI.cloud}</span><span class="wx-b"><span class="loc">${WXLOC[day.id].n} 날씨</span><span class="wx-note">불러오는 중</span></span><span></span></div>`;
  h+=buildMap(day);
  h+='<ol class="tl">';
  day.stops.forEach((s,i)=>{
    const n=i+1;
    h+=`<li class="item${s.kind==='flight'?' kind-flight':''}${i===cur?' now':''}" id="s-${n}">`+
      `<div class="t num">${s.t}${s.est?'<span class="est">예상</span>':''}</div><div class="body">`+
      (i===cur?'<span class="now-tag">지금</span>':'')+
      `<h3>${s.ll?`<span class="badge" aria-hidden="true">${NO[i]}</span>`:''}<span>${s.title}</span></h3>`+
      (s.sub?`<p class="sub">${s.sub}</p>`:'');
    if(s.flight){ const f=s.flight; h+=`<div class="flight"><div class="c num">${f[0]}<small>${f[1]}</small></div><div class="mid">${f[4]}<hr></div><div class="c num" style="text-align:right">${f[2]}<small>${f[3]}</small></div></div>`; }
    if(s.li) h+='<ul>'+s.li.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    if(s.links) h+=`<div class="btns">${s.links.map(k=>`<a class="btn" href="${gmap(k.q)}" target="_blank" rel="noopener">${PIN}${k.t}</a>`).join('')}</div>`;
    if(s.foods) h+=foodsBlock(s.foods);
    if(s.guide){ const g=GUIDES[s.guide]; h+=`<details class="guide"><summary>${g.s}</summary><div class="in">${g.body()}</div></details>`; }
    const dest = s.ll || null;
    let btn='';
    if(dest && prev && !s.noRoute && distKm(prev,dest)>0.15){
      const walk = distKm(prev,dest) < 1.3;
      const dq = s.hotel&&!s.q ? `${dest[0]},${dest[1]}` : (s.q||`${dest[0]},${dest[1]}`);
      const dq2 = s._h ? HOME.addr : dq;
      const url = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(prevQ||`${prev[0]},${prev[1]}`)}&destination=${encodeURIComponent(dq2)}&travelmode=${walk?'walking':'transit'}`;
      btn += `<a class="btn" href="${url}" target="_blank" rel="noopener">${walk?WALK:TRAIN}${prevName}에서 ${walk?'걸어가는 길':'가는 길'}</a>`;
    }

    if(btn) h+=`<div class="btns">${btn}</div>`;
    if(dest){ prev=dest; prevName = s.m || '숙소'; prevQ = s._h ? HOME.addr : ''; }
    h+='</div></li>';
  });
  h+='</ol>';
  return h;
}

function bindInfo(){
  bindHome();
  let saved={}; try{ saved=JSON.parse(localStorage.getItem('check')||'{}'); }catch(e){}
  const boxes=[...document.querySelectorAll('.check input')];
  const prog=()=>{ const n=boxes.filter(b=>b.checked).length; document.getElementById('prog').textContent = n===boxes.length?'다 챙겼어요':`${boxes.length}개 중 ${n}개 챙김`; };
  boxes.forEach(b=>{ b.checked=!!saved[b.dataset.k]; b.addEventListener('change',()=>{ saved[b.dataset.k]=b.checked; try{ localStorage.setItem('check',JSON.stringify(saved)); }catch(e){} prog(); }); });
  prog();

async function unlockHome(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);

  return JSON.parse(new TextDecoder().decode(pt));
}

const WMO=c=>{ if(c===0) return ['sun','맑음']; if(c<=2) return ['part','구름 조금']; if(c===3) return ['cloud','흐림']; if(c<=48) return ['fog','안개']; if(c<=57) return ['rain','이슬비']; if(c<=67) return ['rain','비']; if(c<=77) return ['snow','눈']; if(c<=82) return ['rain','소나기']; if(c<=86) return ['snow','눈']; return ['storm','뇌우']; };
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dayDiff=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
async function getWx(id){
  const date=DATES[id], loc=WXLOC[id], key='wx-'+id, diff=dayDiff(date,NOW.date);
  const cached=lsGet(key,null);
  if(cached && Date.now()-cached.t < (diff<-1 ? 7*864e5 : 30*60e3)) return cached.v;
  if(diff>15) return {later:true};
  const old = diff < -60;
  const base = old ? 'https://archive-api.open-meteo.com/v1/archive' : 'https://api.open-meteo.com/v1/forecast';
  const daily = old ? 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum' : 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,precipitation_sum';
  const url=`${base}?latitude=${loc.ll[0]}&longitude=${loc.ll[1]}&daily=${daily}&timezone=Asia%2FTokyo&start_date=${date}&end_date=${date}`;
  try{
    const r=await fetch(url); if(!r.ok) throw 0; const d=(await r.json()).daily;
    const v={code:d.weather_code[0],max:d.temperature_2m_max[0],min:d.temperature_2m_min[0],pp:d.precipitation_probability_max?d.precipitation_probability_max[0]:null,ps:d.precipitation_sum?d.precipitation_sum[0]:null,past:diff<0};
    if(v.max==null) throw 0;
    lsSet(key,{t:Date.now(),v}); return v;
  }catch(e){ return cached?cached.v:null; }
}
async function fillWx(id){
  const el=document.getElementById('wx'); if(!el) return;
  const loc=WXLOC[id], v=await getWx(id);
  if(el.dataset.id!==id || !el.isConnected) return;
  if(!v){ el.innerHTML=`<span class="wx-ic">${WI.cloud}</span><span class="wx-b"><span class="loc">${loc.n} 날씨</span><span class="wx-note">불러오지 못했어요. 인터넷 연결을 확인해 주세요</span></span><span></span>`; return; }
  if(v.later){ el.innerHTML=`<span class="wx-ic">${WI.cal}</span><span class="wx-b"><span class="loc">${loc.n} 날씨</span><span class="wx-note">예보는 여행 2주 전쯤부터 여기에 떠요</span></span><span></span>`; return; }
  const [ic,tx]=WMO(v.code);
  const rain = v.past ? (v.ps!=null?`강수 ${v.ps}mm`:'') : (v.pp!=null?`비 올 확률 ${v.pp}%`:'');
  el.innerHTML=`<span class="wx-ic">${WI[ic]}</span><span class="wx-b"><span class="loc">${loc.n}</span><b>${tx}</b></span><span class="wx-t num"><span class="hi">${Math.round(v.max)}°</span><span class="lo">최저 ${Math.round(v.min)}°</span></span><div class="wx-foot"><span>${v.past?'그날 날씨':'예보'}</span>${rain?`<span>${rain}</span>`:''}</div>`;
}

let jpCat=0;
function jpSheet(){
  const g=PHRASES[jpCat];
  return `<div class="jp-top"><div class="jp-head"><b>일본어 보여주기</b><button class="jp-x" type="button" data-jp-close aria-label="닫기">×</button></div>
  <div class="jp-chips" role="tablist">${PHRASES.map((c,i)=>`<button class="jp-chip" type="button" role="tab" aria-selected="${i===jpCat}" data-jp-cat="${i}">${c.g}</button>`).join('')}</div></div>
  <p class="map-note" style="margin:10px 2px 8px">누르면 크게 띄워져요. 화면을 그대로 상대에게 보여주세요.</p>
  <div class="jp-list">${g.items.map((p,pi)=>`<button class="jp-item" type="button" data-jp="${jpCat}-${pi}"><span>${p[0]}</span><small lang="ja">${p[1]}</small></button>`).join('')}</div>`;
}
function jpBig(p){
  return `<div class="jp-big"><button class="jp-x" type="button" data-jp-back aria-label="목록으로">‹</button>
    <p class="jp-ja" lang="ja">${p[1]}</p><p class="jp-read">${p[2]}</p><p class="jp-ko">${p[0]}</p>${p[3]?`<p class="jp-tip">${p[3]}</p>`:''}
    <button class="btn" type="button" data-jp-back>다른 문장 보기</button></div>`;
}
const jpDlg=document.createElement('dialog'); jpDlg.className='jp-dlg'; jpDlg.setAttribute('aria-label','일본어 보여주기');
document.body.appendChild(jpDlg);
const jpFab=document.createElement('button'); jpFab.className='jp-fab'; jpFab.type='button'; jpFab.innerHTML='<span lang="ja">あ</span>일본어'; jpFab.setAttribute('aria-label','일본어 보여주기 열기');
document.body.appendChild(jpFab);
let jpY=0;
function lockScroll(){ jpY=scrollY; const b=document.body.style; b.position='fixed'; b.top=`-${jpY}px`; b.left='0'; b.right='0'; b.width='100%'; document.documentElement.style.overflow='hidden'; }
function unlockScroll(){ const b=document.body.style; b.position=''; b.top=''; b.left=''; b.right=''; b.width=''; document.documentElement.style.overflow=''; scrollTo(0,jpY); }
jpFab.addEventListener('click',()=>{ jpDlg.innerHTML=jpSheet(); lockScroll(); jpDlg.showModal(); jpDlg.scrollTop=0; });
jpDlg.addEventListener('close',unlockScroll);
jpDlg.addEventListener('click',e=>{
  if(e.target===jpDlg || e.target.closest('[data-jp-close]')){ jpDlg.close(); return; }
  const c=e.target.closest('[data-jp-cat]'); if(c){ jpCat=+c.dataset.jpCat; jpDlg.innerHTML=jpSheet(); jpDlg.scrollTop=0; const a=jpDlg.querySelector('.jp-chip[aria-selected="true"]'); if(a) a.scrollIntoView({inline:'center',block:'nearest'}); return; }
  const it=e.target.closest('[data-jp]'); if(it){ const [g,i]=it.dataset.jp.split('-').map(Number); jpDlg.innerHTML=jpBig(PHRASES[g].items[i]); jpDlg.scrollTop=0; return; }
  if(e.target.closest('[data-jp-back]')){ jpDlg.innerHTML=jpSheet(); const a=jpDlg.querySelector('.jp-chip[aria-selected="true"]'); if(a) a.scrollIntoView({inline:'center',block:'nearest'}); }
});

if('serviceWorker' in navigator && location.protocol==='https:' && !/claude\.ai$/.test(location.hostname)){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

/* ---------- 탭, 라우팅 ---------- */
const tabs=document.getElementById('tabs'), view=document.getElementById('view');
const VIEWS=[...DAYS.map(d=>({id:d.id,d:d.d,w:d.w})),{id:'prep',d:'✓',w:'준비'}];
tabs.innerHTML=VIEWS.map(v=>`<button class="tab" role="tab" data-id="${v.id}" aria-controls="view"><span class="d num">${v.d}</span><span class="w">${v.w}</span></button>`).join('');

function show(id, scroll){
  if(!VIEWS.some(v=>v.id===id)) id = todayId || 'day1';
  tabs.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected', t.dataset.id===id));
  if(id==='prep'){ view.innerHTML=renderInfo(); bindInfo(); }
  else { const day=DAYS.find(d=>d.id===id); view.innerHTML=renderDay(day);
    view.querySelectorAll('.pin').forEach(p=>{
      const go=()=>{ const el=document.getElementById('s-'+p.dataset.go); if(el) el.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); };
      p.addEventListener('click',go); p.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    });
    fillWx(id);
    const now=view.querySelector('.item.now'); if(now && !scroll) setTimeout(()=>now.scrollIntoView({block:'center'}),50);
  }
  if(scroll){ scrollTo({top:0, behavior:'auto'}); }
}
view.addEventListener('click',e=>{
  const b=e.target.closest('.peek-btn'); if(!b) return;
  const card=b.closest('.food'), pk=card.querySelector('.peek');
  if(pk.firstChild){ pk.innerHTML=''; b.setAttribute('aria-expanded','false'); b.lastChild.textContent='지도 보기'; return; }
  pk.innerHTML=`<iframe src="${MAPS_KEY ? `https://www.google.com/maps/embed/v1/place?key=${MAPS_KEY}&q=${encodeURIComponent(pk.dataset.q)}&language=ko` : `https://maps.google.com/maps?q=${encodeURIComponent(pk.dataset.q)}&hl=ko&z=16&output=embed`}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="${esc(pk.dataset.q)} 지도"></iframe>${MAPS_KEY?'':'<p class="map-note">평점, 사진, 리뷰는 옆의 ‘사진, 리뷰, 영업시간’ 버튼으로 볼 수 있어요.</p>'}`;
  b.setAttribute('aria-expanded','true'); b.lastChild.textContent='지도 접기';
});
tabs.addEventListener('click',e=>{ const b=e.target.closest('.tab'); if(!b) return; if(location.hash!=='#'+b.dataset.id) location.hash=b.dataset.id; else show(b.dataset.id,true); });
addEventListener('hashchange',()=>show(location.hash.slice(1),true));
show(location.hash.slice(1), false);
})();
